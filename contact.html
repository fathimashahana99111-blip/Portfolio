  <!-- Contact Section -->
  <section class="max-w-4xl mx-auto py-20 px-6">
    <h2 class="text-3xl font-bold mb-6">Contact Me</h2>

    <form class="space-y-4">
      <input
        type="text"
        placeholder="Your Name"
        class="w-full p-3 bg-black border border-gray-700 rounded text-white"
      />

      <input
        type="email"
        placeholder="Your Email"
        class="w-full p-3 bg-black border border-gray-700 rounded text-white"
      />

      <textarea
        placeholder="Your Message"
        rows="5"
        class="w-full p-3 bg-black border border-gray-700 rounded text-white"
      ></textarea>

      <button
        type="submit"
        class="bg-blue-500 text-black px-6 py-2 rounded hover:bg-blue-400"
      >
        Send Message
      </button>
    </form>
  </section>
